name: Integration (sandbox)

# Hits the real Selectwin sandbox API. Runs on a schedule + on demand, NOT on
# every PR. Self-skips when the key secret is absent, so it's a no-op until
# SELECTWIN_SANDBOX_KEY is configured on the repo.
on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: sandbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          SELECTWIN_SANDBOX_KEY: ${{ secrets.SELECTWIN_SANDBOX_KEY }}
        run: pytest -m integration
