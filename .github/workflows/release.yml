name: Release (PyPI)

# Publishes `selectwin` to PyPI on a version tag (vX.Y.Z), tokenless via PyPI
# Trusted Publishing (OIDC).
#
# One-time setup on pypi.org (Account → Publishing → Add a pending publisher):
#   PyPI project = selectwin, owner = selectwin, repo = sdk-python,
#   workflow = release.yml, environment = pypi.
# With that in place no PyPI API token secret is needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/selectwin
    permissions:
      id-token: write   # OIDC token exchange for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
