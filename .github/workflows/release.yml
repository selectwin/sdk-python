name: Release (PyPI)

# Publishes `selectwin` to PyPI on a version tag (vX.Y.Z), tokenless via PyPI
# Trusted Publishing (OIDC).
#
# One-time setup on pypi.org (Account → Publishing → Add a pending publisher):
#   PyPI project = selectwin, owner = selectwin, repo = sdk-python,
#   workflow = release.yml, environment = pypi.
# With that in place no PyPI API token secret is needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.guard.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VER"
            exit 1
          fi
      - name: Guard — is this version already on PyPI?
        id: guard
        # Idempotency gate. PyPI NEVER allows overwriting a released version, so
        # a re-run or re-pushed tag of an already-published version would only be
        # noise. Checking the release JSON API up front lets us skip the build +
        # publish entirely (fast, green no-op) instead of leaning on the publish
        # action's silent skip-existing after wasting a build.
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/selectwin/$VER/json")
          if [ "$CODE" = "200" ]; then
            echo "::notice::selectwin $VER is already on PyPI — skipping publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build sdist + wheel
        if: steps.guard.outputs.published != 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.published != 'true'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/selectwin
    permissions:
      id-token: write   # OIDC token exchange for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # belt-and-suspenders: guard above already gates this job
