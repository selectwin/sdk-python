[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selectwin"
version = "0.1.3"
description = "Official Selectwin Python SDK — payments (card, PIX, boleto), subscriptions, webhooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Selectwin", email = "help@selectwin.io" }]
keywords = ["selectwin", "payments", "pix", "boleto", "subscriptions", "webhooks", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23",
  "attrs>=21.3.0",
  "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "respx>=0.20",
  "mypy>=1.6",
]

[project.urls]
Homepage = "https://selectwin.io/docs/sdk/python/overview"
Repository = "https://github.com/selectwin/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/selectwin"]

[tool.hatch.build.targets.sdist]
include = ["src/selectwin", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: sandbox integration tests (need SELECTWIN_SANDBOX_KEY)"]

[tool.mypy]
ignore_missing_imports = true
# The generated core is checked by its own generator; focus mypy on the DX shell.
exclude = ['^src/selectwin/_core/']
